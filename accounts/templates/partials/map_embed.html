{% comment %}Set site.map_embed_url to the Google Maps "Embed a map" src URL. Placeholder shown until then.{% endcomment %}
{% if site.map_embed_url %}
  <iframe class="ag-map" src="{{ site.map_embed_url }}" title="Map showing the clinic location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
{% else %}
  <div class="ag-map ag-map--placeholder" role="img" aria-label="Map placeholder"><i class="bi bi-geo-alt" aria-hidden="true"></i><p>Google Maps embed goes here.<br>Add the embed link in Website Settings.</p></div>
{% endif %}
