{% comment %}One shared modal. Buttons with data-cancel-url="{% url 'cancel_appointment' a.pk %}" and data-cancel-label="..." open it. The form POSTs (CSRF) to that URL.{% endcomment %}
<div class="modal fade" id="cancelModal" tabindex="-1" aria-labelledby="cancelTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content ag-modal">
    <form method="post" id="cancelForm" action="">
      {% csrf_token %}
      <div class="modal-header"><h2 class="modal-title h4" id="cancelTitle">Cancel this appointment?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><p id="cancelLabel" class="mb-2 fw-bold"></p><p class="ag-help">The clinic will be notified. You can book a new time at any point.</p></div>
      <div class="modal-footer"><button type="button" class="ag-btn ag-btn--outline ag-btn--sm" data-bs-dismiss="modal">Keep appointment</button><button type="submit" class="ag-btn ag-btn--danger ag-btn--sm">Yes, cancel it</button></div>
    </form>
  </div></div>
</div>
