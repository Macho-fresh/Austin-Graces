{% comment %}Usage: include with faq=faq, uid=forloop.counter. Fields: question, answer, category.{% endcomment %}
<div class="ag-accordion__item" data-faq-item data-category="{{ faq.category|default:'' }}">
  <h3 class="ag-accordion__heading">
    <button class="ag-accordion__btn" type="button" aria-expanded="false" aria-controls="faq-{{ uid }}" id="faq-btn-{{ uid }}">
      <span data-faq-question>{{ faq.question }}</span><i class="bi bi-chevron-down" aria-hidden="true"></i>
    </button>
  </h3>
  <div class="ag-accordion__panel" id="faq-{{ uid }}" role="region" aria-labelledby="faq-btn-{{ uid }}" hidden>
    <div data-faq-answer>{{ faq.answer|linebreaks }}</div>
  </div>
</div>
